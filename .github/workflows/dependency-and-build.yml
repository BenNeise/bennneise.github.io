name: Dependency and Build Checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
          bundler-cache: true

      - name: Install bundler-audit
        run: gem install bundler-audit --no-document

      - name: Update advisory DB
        run: bundler-audit update

      - name: Run bundler-audit
        run: bundler-audit check

      - name: Build site
        run: bundle exec jekyll build --safe
